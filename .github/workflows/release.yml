name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          cache: false
          cache_dependency_path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @nexube/types run build && pnpm --filter @nexube/store run build

      - name: Build Windows installer
        working-directory: apps/desktop
        run: pnpm electron:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: apps/desktop/release/*.exe

  build-linux:
    name: Build Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          cache: false
          cache_dependency_path: pnpm-lock.yaml

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libgl1 libegl1 libdbus-1-3 libxkbcommon-x11-0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @nexube/types run build && pnpm --filter @nexube/store run build

      - name: Build Linux installers
        working-directory: apps/desktop
        run: pnpm electron:build

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

