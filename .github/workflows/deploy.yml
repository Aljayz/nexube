name: Deploy (Test Build)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-downloader-windows:
    name: Build Downloader (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Install Python dependencies
        run: pip install -r apps/desk-vid-dl/requirements.txt

      - name: Build desk-vid-dl (Windows)
        working-directory: apps/desk-vid-dl
        run: python build.py

      - name: Verify downloader binary exists
        shell: bash
        run: |
          if [ -f "apps/desktop/resources/desk-vid-dl/windows/desk-vid-dl/desk-vid-dl.exe" ]; then
            echo "Windows downloader binary found"
          else
            echo "ERROR: Windows downloader binary not found!"
            ls -la apps/desktop/resources/desk-vid-dl/windows/desk-vid-dl/ || true
            exit 1
          fi

      - name: Upload downloader artifact
        uses: actions/upload-artifact@v4
        with:
          name: desk-vid-dl-windows
          path: apps/desktop/resources/desk-vid-dl/windows/desk-vid-dl/
          retention-days: 14

  build-downloader-linux:
    name: Build Downloader (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Install Python dependencies
        run: pip install -r apps/desk-vid-dl/requirements.txt

      - name: Build desk-vid-dl (Linux)
        working-directory: apps/desk-vid-dl
        run: python build.py

      - name: Verify downloader binary exists
        run: |
          if [ -f "apps/desktop/resources/desk-vid-dl/linux/desk-vid-dl/desk-vid-dl" ]; then
            echo "Linux downloader binary found"
          else
            echo "ERROR: Linux downloader binary not found!"
            ls -la apps/desktop/resources/desk-vid-dl/linux/desk-vid-dl/ || true
            exit 1
          fi

      - name: Upload downloader artifact
        uses: actions/upload-artifact@v4
        with:
          name: desk-vid-dl-linux
          path: apps/desktop/resources/desk-vid-dl/linux/desk-vid-dl/
          retention-days: 14

  build-windows:
    name: Build Windows (NSIS)
    needs: build-downloader-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          cache: false
          cache_dependency_path: pnpm-lock.yaml

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @nexube/types run build && pnpm --filter @nexube/store run build

      - name: Download pre-built downloader
        uses: actions/download-artifact@v4
        with:
          name: desk-vid-dl-windows
          path: apps/desktop/resources/desk-vid-dl/windows/desk-vid-dl/

      - name: Verify downloaded binary
        shell: bash
        run: |
          if compgen -G "apps/desktop/resources/desk-vid-dl/windows/desk-vid-dl/*.exe" > /dev/null; then
            echo "Downloader binary ready"
          else
            echo "ERROR: No .exe found in downloaded artifact!"
            find apps/desktop/resources/desk-vid-dl/ -type f
            exit 1
          fi

      - name: Set version
        shell: bash
        working-directory: apps/desktop
        run: |
          VERSION=$(node -p "require('./package.json').version")-beta.${{ github.run_number }}
          echo "export const APP_VERSION = '${VERSION}';" > src/version.js

      - name: Build Windows installer
        working-directory: apps/desktop
        run: pnpm electron:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: nexube-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
          retention-days: 14

  build-linux:
    name: Build Linux (AppImage + deb)
    needs: build-downloader-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          cache: false
          cache_dependency_path: pnpm-lock.yaml

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libgl1 libegl1 libdbus-1-3 libxkbcommon-x11-0

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @nexube/types run build && pnpm --filter @nexube/store run build

      - name: Download pre-built downloader
        uses: actions/download-artifact@v4
        with:
          name: desk-vid-dl-linux
          path: apps/desktop/resources/desk-vid-dl/linux/desk-vid-dl/

      - name: Set executable permission on downloader
        run: chmod +x apps/desktop/resources/desk-vid-dl/linux/desk-vid-dl/desk-vid-dl

      - name: Verify downloaded binary
        run: |
          TARGET="apps/desktop/resources/desk-vid-dl/linux/desk-vid-dl"
          if [ -d "$TARGET/_internal" ] && [ -f "$TARGET/desk-vid-dl" ]; then
            echo "Downloader binary ready ($TARGET/desk-vid-dl)"
          else
            echo "ERROR: Invalid downloader bundle in $TARGET"
            find "$TARGET" -type f
            exit 1
          fi

      - name: Set version
        working-directory: apps/desktop
        run: |
          VERSION=$(node -p "require('./package.json').version")-beta.${{ github.run_number }}
          echo "export const APP_VERSION = '${VERSION}';" > src/version.js

      - name: Build Linux installers
        working-directory: apps/desktop
        run: pnpm electron:build

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: nexube-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage.blockmap
          retention-days: 14
